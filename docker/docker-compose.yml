version: '3.9'
services:
  frontend:
    image: node:20-alpine
    working_dir: /app
    volumes:
      - ../frontend:/app
    command: sh -c "npm install && npm run dev -- --hostname 0.0.0.0"
    ports:
      - "3000:3000"
    environment:
      - NEXT_TELEMETRY_DISABLED=1

  backend:
    image: maven:3.9-eclipse-temurin-25
    working_dir: /workspace
    volumes:
      - ../backend:/workspace
    command: sh -c "mvn spring-boot:run"
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/${POSTGRES_DB:-intellibiz}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-postgres}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is not set - run node scripts/generate-env.js}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is not set - run node scripts/generate-env.js}
      SPRING_DATA_MONGODB_URI: mongodb://mongodb:27017/intellibiz
      AI_SERVICE_URL: http://ai:8000
      BOOTSTRAP_ADMIN_USERNAME: ${BOOTSTRAP_ADMIN_USERNAME:-admin}
      BOOTSTRAP_ADMIN_EMAIL: ${BOOTSTRAP_ADMIN_EMAIL:-admin@ceylonintellibiz.local}
      BOOTSTRAP_ADMIN_PASSWORD: ${BOOTSTRAP_ADMIN_PASSWORD:-}
    depends_on:
      db:
        condition: service_healthy
      mongodb:
        condition: service_started

  ai:
    image: python:3.11-slim
    working_dir: /app
    volumes:
      - ../python-ai:/app
    command: sh -c "pip install -r requirements.txt && uvicorn app:app --host 0.0.0.0 --port 8000"
    ports:
      # Only the backend needs the AI service, so it is not exposed beyond this machine.
      - "127.0.0.1:8000:8000"

  db:
    image: postgres:16
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-intellibiz}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is not set - run node scripts/generate-env.js}
    ports:
      # Databases are only reachable from this machine (and from the other containers).
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ../database:/docker-entrypoint-initdb.d

  mongodb:
    image: mongo:7
    ports:
      - "127.0.0.1:27017:27017"
    volumes:
      - mongodata:/data/db
      - ../database/mongo-init.js:/docker-entrypoint-initdb.d/mongo-init.js:ro
    environment:
      MONGO_INITDB_DATABASE: intellibiz

volumes:
  pgdata:
  mongodata:

