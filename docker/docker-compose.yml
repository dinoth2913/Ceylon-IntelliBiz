version: '3.9'
services:
  frontend:
    image: node:20-alpine
    working_dir: /app
    volumes:
      - ../frontend:/app
    command: sh -c "npm install && npm run dev -- --hostname 0.0.0.0"
    ports:
      - "3000:3000"
    environment:
      - NEXT_TELEMETRY_DISABLED=1

  backend:
    image: maven:3.9-eclipse-temurin-25
    working_dir: /workspace
    volumes:
      - ../backend:/workspace
    command: sh -c "mvn spring-boot:run"
    ports:
      - "8080:8080"
    # MongoDB can still be finishing its first-start setup when the backend boots, so retry instead of giving up.
    restart: on-failure
    environment:
      MONGODB_HOST: mongodb
      MONGODB_DATABASE: ${MONGODB_DATABASE:-intellibiz}
      # The backend uses its own restricted user (created by database/mongo-init.js), never the root user.
      MONGODB_AUTH_DATABASE: ${MONGODB_DATABASE:-intellibiz}
      MONGODB_USERNAME: ${MONGODB_APP_USER:-intellibiz_app}
      MONGODB_PASSWORD: ${MONGODB_APP_PASSWORD:?MONGODB_APP_PASSWORD is not set - run node scripts/generate-env.js}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is not set - run node scripts/generate-env.js}
      AI_SERVICE_URL: http://ai:8000
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:3000}
      RATE_LIMIT_MAX_REQUESTS: ${RATE_LIMIT_MAX_REQUESTS:-5}
      RATE_LIMIT_WINDOW_SECONDS: ${RATE_LIMIT_WINDOW_SECONDS:-60}
      BOOTSTRAP_ADMIN_USERNAME: ${BOOTSTRAP_ADMIN_USERNAME:-admin}
      BOOTSTRAP_ADMIN_EMAIL: ${BOOTSTRAP_ADMIN_EMAIL:-admin@ceylonintellibiz.local}
      BOOTSTRAP_ADMIN_PASSWORD: ${BOOTSTRAP_ADMIN_PASSWORD:-}
      # Only set these temporarily, to recover a locked-out admin — see .env.example.
      RECOVERY_ADMIN_USERNAME: ${RECOVERY_ADMIN_USERNAME:-}
      RECOVERY_ADMIN_PASSWORD: ${RECOVERY_ADMIN_PASSWORD:-}
    depends_on:
      mongodb:
        condition: service_started

  ai:
    image: python:3.11-slim
    working_dir: /app
    volumes:
      - ../python-ai:/app
    command: sh -c "pip install -r requirements.txt && uvicorn app:app --host 0.0.0.0 --port 8000"
    ports:
      # Only the backend needs the AI service, so it is not exposed beyond this machine.
      - "127.0.0.1:8000:8000"

  mongodb:
    image: mongo:7
    ports:
      # Only reachable from this machine (the other containers use the internal network). Published on 27018 so it
      # does not collide with a MongoDB you may already run on the default 27017; change it in .env if you like.
      - "127.0.0.1:${MONGODB_PUBLISHED_PORT:-27018}:27017"
    volumes:
      - mongodata:/data/db
      - ../database/mongo-init.js:/docker-entrypoint-initdb.d/mongo-init.js:ro
    environment:
      # Setting a root user turns authentication on. These only take effect when the data volume is first created.
      MONGO_INITDB_ROOT_USERNAME: ${MONGODB_ROOT_USER:-root}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGODB_ROOT_PASSWORD:?MONGODB_ROOT_PASSWORD is not set - run node scripts/generate-env.js}
      MONGO_INITDB_DATABASE: ${MONGODB_DATABASE:-intellibiz}
      # Read by database/mongo-init.js to create the backend's restricted user.
      MONGODB_APP_USER: ${MONGODB_APP_USER:-intellibiz_app}
      MONGODB_APP_PASSWORD: ${MONGODB_APP_PASSWORD:?MONGODB_APP_PASSWORD is not set - run node scripts/generate-env.js}

volumes:
  mongodata:
