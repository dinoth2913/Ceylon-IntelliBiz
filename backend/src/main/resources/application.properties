spring.application.name=intellibiz-backend
server.port=8080
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://db:5432/intellibiz}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:postgres}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.show-sql=true

# MongoDB Configuration
spring.data.mongodb.uri=${SPRING_DATA_MONGODB_URI:mongodb://localhost:27017/intellibiz}
spring.data.mongodb.database=intellibiz

# JWT Configuration
jwt.secret=${JWT_SECRET:ceylon-intellibiz-dev-secret-change-me-in-production-please-0123456789}
jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}
