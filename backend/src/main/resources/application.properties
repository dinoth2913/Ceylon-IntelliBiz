spring.application.name=intellibiz-backend
server.port=8080
# MongoDB (the only database). Credentials have no default on purpose: see .env.example.
spring.data.mongodb.host=${MONGODB_HOST:localhost}
spring.data.mongodb.port=${MONGODB_PORT:27017}
spring.data.mongodb.database=${MONGODB_DATABASE:intellibiz}
spring.data.mongodb.authentication-database=${MONGODB_AUTH_DATABASE:intellibiz}
spring.data.mongodb.username=${MONGODB_USERNAME}
spring.data.mongodb.password=${MONGODB_PASSWORD}
# Creates the unique/lookup indexes declared on the models (usernames, order numbers, SKUs...) at startup.
spring.data.mongodb.auto-index-creation=true

# Browser origins allowed to call the API (comma-separated). Set this to your real site address when deploying.
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000}

# Limits the public, unauthenticated POST endpoints (demo requests, chat, marketplace checkout) to this
# many calls per IP address in the window below. In-memory and per-instance — see RateLimiter's javadoc.
app.rate-limit.max-requests=${RATE_LIMIT_MAX_REQUESTS:5}
app.rate-limit.window-seconds=${RATE_LIMIT_WINDOW_SECONDS:60}

# AI service (Python FastAPI)
ai.service.url=${AI_SERVICE_URL:http://localhost:8000}

# First admin, created at startup only if no admin exists yet and a password is provided.
# Leave BOOTSTRAP_ADMIN_PASSWORD unset to disable. Sign-up can only ever create STAFF accounts.
app.bootstrap-admin.username=${BOOTSTRAP_ADMIN_USERNAME:admin}
app.bootstrap-admin.email=${BOOTSTRAP_ADMIN_EMAIL:admin@ceylonintellibiz.local}
app.bootstrap-admin.password=${BOOTSTRAP_ADMIN_PASSWORD:}

# Recovery for a locked-out admin: set both at startup to force-reset that EXISTING admin's password
# (it refuses to touch a non-admin account). Unset them again once you've signed in with the new password —
# leaving them set means every restart resets the password back to this value.
app.recovery-admin.username=${RECOVERY_ADMIN_USERNAME:}
app.recovery-admin.password=${RECOVERY_ADMIN_PASSWORD:}

# JWT Configuration
# No default on purpose: JwtService refuses to start without a random secret of 32+ characters.
# Generate all secrets with: node scripts/generate-env.js
jwt.secret=${JWT_SECRET}
jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}
