# Used only by the automated tests. These values are not real secrets and are never used at runtime.
jwt.secret=test-only-signing-key-not-a-real-secret-0123456789abcdef
jwt.expiration-ms=3600000

# High on purpose: several tests fire many requests at the same guarded endpoint (from the same
# "client", since MockMvc has no real network address) in one run. RateLimitFilterTest sets its own
# low limit directly to exercise the real blocking behaviour instead of relying on this value.
app.rate-limit.max-requests=1000
app.rate-limit.window-seconds=60
